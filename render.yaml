services:
  # Backend API Service
  - type: web
    name: earms-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: earms_db
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/health
